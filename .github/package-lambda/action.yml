name: 'Package Lambda'
description: 'Packages a Lambda function and uploads it to S3, skipping via the S3 build ledger when unchanged'
inputs:
  s3_bucket_name:
    description: 'S3 zip-bucket name (also stores build-ledger/<env>/<key_prefix>.json)'
    required: true
  key_prefix:
    description: 'Prefix for the S3 zip key and ledger artifact_id (e.g., "slack-error-notifier")'
    required: true
  python_version:
    description: 'Python version to use when installing dependencies (e.g., "3.12")'
    required: false
    default: '3.12'
  build_directory:
    description: 'Directory containing the Lambda function code'
    required: true
  build_env:
    description: 'JSON array of environment variables to use during build, format: [{"name": "VAR_NAME", "value": "value"}]'
    required: false
    default: '[]'
  filter_pattern:
    description: 'JSON array of glob patterns, or a single pattern string, to check for changed files'
    required: true
  force_build:
    description: 'Force a rebuild (skip ledger/change checks). Also honored when the workflow env FORCE_BUILD is true.'
    required: false
    default: 'false'
  ledger_prefix:
    description: 'S3 key prefix for ledger files on the zip bucket'
    required: false
    default: 'build-ledger/'
  role_to_assume:
    description: 'IAM role ARN for OIDC (leave empty for static keys)'
    required: false
    default: ""
  aws_access_key_id:
    description: 'AWS Access Key ID (ignored when role_to_assume is set)'
    required: false
  aws_secret_access_key:
    description: 'AWS Secret Access Key (ignored when role_to_assume is set)'
    required: false
  github_token:
    description: 'GitHub token with permissions to read workflow runs'
    required: true
  pat:
    description: 'Personal Access Token for Git operations'
    required: true
  username:
    description: 'Git username for Git operations'
    required: true
  email:
    description: 'Git email for Git operations'
    required: true

outputs:
  s3_key:
    description: "The S3 object key of the uploaded or reused Lambda package"
    value: ${{ steps.package.outputs.s3_key || steps.reuse.outputs.s3_key }}
  reason:
    description: "Decision reason: forced | ledger_missing | ledger_failed | source_changed | no_changes"
    value: ${{ steps.decision.outputs.reason }}

runs:
  using: "composite"
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 50
        fetch-tags: false
        filter: blob:none

    - name: Configure Git # Required because we are using submodules
      shell: bash
      run: |
        git config --global user.email "${{ inputs.email }}"
        git config --global user.name "${{ inputs.username }}"
        git config --global url.https://${{ inputs.pat }}@github.com/.insteadOf https://github.com/

    - name: Checkout submodules
      shell: bash
      run: git submodule update --init --recursive

    - name: Configure AWS credentials (OIDC)
      if: ${{ inputs.role_to_assume != '' }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role_to_assume }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Configure AWS credentials (Static Keys)
      if: ${{ inputs.role_to_assume == '' }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Decide skip or rebuild
      id: decision
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.key_prefix }}
        FILTER_PATTERNS: ${{ inputs.filter_pattern }}
        S3_BUCKET: ${{ inputs.s3_bucket_name }}
        ENV: ${{ env.ENV }}
        LEDGER_PREFIX: ${{ inputs.ledger_prefix }}
        FORCE_BUILD: ${{ inputs.force_build == 'true' || env.FORCE_BUILD == 'true' }}
        GITHUB_SHA: ${{ github.sha }}
        PAT: ${{ inputs.pat }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/decide.sh" >> "$GITHUB_OUTPUT"

    - name: Verify reuse package
      id: reuse
      if: steps.decision.outputs.should_build != 'true'
      shell: bash
      env:
        LAST_SUCCESS_SHA: ${{ steps.decision.outputs.last_success_sha }}
        KEY_PREFIX: ${{ inputs.key_prefix }}
        S3_BUCKET: ${{ inputs.s3_bucket_name }}
        BRANCH: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        if [ -z "${LAST_SUCCESS_SHA:-}" ]; then
          echo "No last_success_sha; cannot reuse a zip" >&2
          echo "hit=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ ! -f "$GITHUB_ACTION_PATH/determine-env-and-key.sh" ]; then
          echo "Missing helper: $GITHUB_ACTION_PATH/determine-env-and-key.sh" >&2
          exit 1
        fi
        eval "$(bash "$GITHUB_ACTION_PATH/determine-env-and-key.sh" --branch "$BRANCH" --key-prefix "$KEY_PREFIX" --sha "$LAST_SUCCESS_SHA")"
        if [ -z "${s3_key:-}" ]; then
          echo "Failed to compute reuse s3_key" >&2
          exit 1
        fi
        if aws s3api head-object --bucket "$S3_BUCKET" --key "$s3_key" >/dev/null 2>&1; then
          echo "Reusing existing Lambda package $s3_key" >&2
          echo "s3_key=$s3_key" >> "$GITHUB_OUTPUT"
          echo "hit=true" >> "$GITHUB_OUTPUT"
        else
          echo "Reuse key $s3_key is missing; will package" >&2
          echo "hit=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Python
      uses: actions/setup-python@v4
      if: steps.decision.outputs.should_build == 'true' || steps.reuse.outputs.hit != 'true'
      with:
        python-version: ${{ inputs.python_version }}

    - name: Package Lambda
      id: package
      if: steps.decision.outputs.should_build == 'true' || steps.reuse.outputs.hit != 'true'
      shell: bash
      run: |
        set -Eeuo pipefail
        if [ ! -f "$GITHUB_ACTION_PATH/determine-env-and-key.sh" ]; then
          echo "Missing helper: $GITHUB_ACTION_PATH/determine-env-and-key.sh" >&2
          exit 1
        fi
        eval "$(bash "$GITHUB_ACTION_PATH/determine-env-and-key.sh" --branch "${{ github.ref_name }}" --key-prefix "${{ inputs.key_prefix }}" --sha "${{ github.sha }}")"
        S3_KEY="$s3_key"
        if [ -z "${S3_KEY:-}" ]; then
          echo "Failed to compute S3_KEY" >&2
          exit 1
        fi
        S3_URI="s3://${{ inputs.s3_bucket_name }}/$S3_KEY"

        echo "Building new Lambda package..."

        TEMP_DIR=$(mktemp -d)

        source "$GITHUB_ACTION_PATH/export-build-env.sh" --json "${{ inputs.build_env }}"

        cp -r ${{ inputs.build_directory }}/* $TEMP_DIR/

        cd $TEMP_DIR

        if [ -f "package.json" ]; then
          npm install --production
        elif [ -f "requirements.txt" ]; then
          echo "Installing Python dependencies with Python ${{ inputs.python_version }}..."
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -t .
        fi

        zip -r lambda_package.zip ./* -x "*.git*" "*__pycache__*" "*.pytest_cache*" "*.venv*"

        aws s3 cp lambda_package.zip $S3_URI

        rm -rf $TEMP_DIR

        echo "s3_key=$S3_KEY" >> $GITHUB_OUTPUT
        echo "built=true" >> $GITHUB_OUTPUT

    - name: Update build ledger
      if: ${{ always() && steps.decision.outcome == 'success' && (steps.decision.outputs.should_build == 'true' || steps.reuse.outputs.hit != 'true') }}
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.key_prefix }}
        S3_BUCKET: ${{ inputs.s3_bucket_name }}
        ENV: ${{ env.ENV }}
        LEDGER_PREFIX: ${{ inputs.ledger_prefix }}
        PACKAGE_OUTCOME: ${{ steps.package.outcome }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../lib/ledger.sh"
        status="failure"
        if [[ "${PACKAGE_OUTCOME}" == "success" ]]; then
          status="success"
        fi
        ledger_write "$ARTIFACT_ID" "$status" "$GITHUB_SHA" "$S3_BUCKET" "$ENV" "${LEDGER_PREFIX:-build-ledger/}"
