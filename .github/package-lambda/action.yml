# Runtime contract (see resolve-runtime.sh):
#   runtime: python (default)
#     Copies build_directory as-is into the zip. If it has a requirements.txt,
#     installs it with pip -t . first. Unchanged from before the "node" runtime
#     existed; python_version keeps working for existing callers.
#   runtime: node
#     build_directory must be a pnpm workspace package (name read from its
#     package.json) with a "build:lambda" script that produces a
#     self-contained bundle - every dependency inlined, no further
#     `npm install` at deploy time - at "<build_directory>/dist/lambda/".
#     The action runs `pnpm install --filter <pkg>... --frozen-lockfile` from
#     the repo root (so the workspace dependency closure resolves), then
#     `pnpm --dir <build_directory> run build:lambda`, then zips the flat
#     contents of dist/lambda/ (e.g. handler.mjs sits at the zip root).
#     Private @scope packages resolve via NODE_AUTH_TOKEN, set from the same
#     `pat` input already used for git operations.
name: 'Package Lambda'
description: 'Packages a Lambda function and uploads it to S3, skipping via the S3 build ledger when unchanged'
inputs:
  s3_bucket_name:
    description: 'S3 zip-bucket name (also stores build-ledger/<env>/<key_prefix>.json)'
    required: true
  key_prefix:
    description: 'Prefix for the S3 zip key and ledger artifact_id (e.g., "slack-error-notifier")'
    required: true
  python_version:
    description: 'Python version to use when installing dependencies (e.g., "3.12"). Ignored unless runtime is "python"; kept for existing callers.'
    required: false
    default: '3.12'
  runtime:
    description: 'Lambda build runtime: "python" (default) or "node"'
    required: false
    default: 'python'
  runtime_version:
    description: 'Runtime version override. Defaults: python -> python_version or 3.12; node -> 22.'
    required: false
    default: ''
  build_directory:
    description: >-
      Directory containing the Lambda function code. For runtime "node", a
      pnpm workspace package whose "build:lambda" script writes a
      self-contained bundle to "<build_directory>/dist/lambda/".
    required: true
  build_env:
    description: 'JSON array of environment variables to use during build, format: [{"name": "VAR_NAME", "value": "value"}]'
    required: false
    default: '[]'
  filter_pattern:
    description: 'JSON array of glob patterns, or a single pattern string, to check for changed files'
    required: true
  force_build:
    description: 'Force a rebuild (skip ledger/change checks). Callers should pass the workflow FORCE_BUILD env as this input.'
    required: false
    default: 'false'
  ledger_prefix:
    description: 'S3 key prefix for ledger files on the zip bucket'
    required: false
    default: 'build-ledger/'
  role_to_assume:
    description: 'IAM role ARN for OIDC (leave empty for static keys)'
    required: false
    default: ""
  aws_access_key_id:
    description: 'AWS Access Key ID (ignored when role_to_assume is set)'
    required: false
  aws_secret_access_key:
    description: 'AWS Secret Access Key (ignored when role_to_assume is set)'
    required: false
  pat:
    description: 'Personal Access Token for Git operations'
    required: true
  username:
    description: 'Git username for Git operations'
    required: true
  email:
    description: 'Git email for Git operations'
    required: true

outputs:
  s3_key:
    description: "The S3 object key of the uploaded or reused Lambda package"
    value: ${{ steps.package.outputs.s3_key || steps.reuse.outputs.s3_key }}
  reason:
    description: "Decision reason: forced | ledger_missing | ledger_failed | source_changed | no_changes | reuse_miss"
    value: ${{ steps.reuse.outputs.reason || steps.decision.outputs.reason }}

runs:
  using: "composite"
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 50
        fetch-tags: false
        filter: blob:none

    - name: Configure Git # Required because we are using submodules
      shell: bash
      run: |
        git config --global user.email "${{ inputs.email }}"
        git config --global user.name "${{ inputs.username }}"
        git config --global url.https://${{ inputs.pat }}@github.com/.insteadOf https://github.com/

    - name: Checkout submodules
      shell: bash
      run: git submodule update --init --recursive

    - name: Configure AWS credentials (OIDC)
      if: ${{ inputs.role_to_assume != '' }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role_to_assume }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Configure AWS credentials (Static Keys)
      if: ${{ inputs.role_to_assume == '' }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Decide skip or rebuild
      id: decision
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.key_prefix }}
        FILTER_PATTERNS: ${{ inputs.filter_pattern }}
        S3_BUCKET: ${{ inputs.s3_bucket_name }}
        ENV: ${{ env.ENV }}
        LEDGER_PREFIX: ${{ inputs.ledger_prefix }}
        FORCE_BUILD: ${{ inputs.force_build }}
        GITHUB_SHA: ${{ github.sha }}
        PAT: ${{ inputs.pat }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/decide.sh"

    - name: Verify reuse package
      id: reuse
      if: steps.decision.outputs.should_build != 'true'
      shell: bash
      env:
        LAST_SUCCESS_SHA: ${{ steps.decision.outputs.last_success_sha }}
        KEY_PREFIX: ${{ inputs.key_prefix }}
        S3_BUCKET: ${{ inputs.s3_bucket_name }}
        BRANCH: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/reuse.sh"

    - name: Resolve build runtime
      id: runtime
      if: steps.decision.outputs.should_build == 'true' || steps.reuse.outputs.hit != 'true'
      shell: bash
      env:
        RUNTIME: ${{ inputs.runtime }}
        RUNTIME_VERSION: ${{ inputs.runtime_version }}
        PYTHON_VERSION: ${{ inputs.python_version }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/resolve-runtime.sh"

    - name: Setup Python
      uses: actions/setup-python@v4
      if: (steps.decision.outputs.should_build == 'true' || steps.reuse.outputs.hit != 'true') && inputs.runtime == 'python'
      with:
        python-version: ${{ steps.runtime.outputs.version }}

    - name: Setup Node
      uses: actions/setup-node@v4
      if: (steps.decision.outputs.should_build == 'true' || steps.reuse.outputs.hit != 'true') && inputs.runtime == 'node'
      with:
        node-version: ${{ steps.runtime.outputs.version }}

    - name: Enable Corepack
      if: (steps.decision.outputs.should_build == 'true' || steps.reuse.outputs.hit != 'true') && inputs.runtime == 'node'
      shell: bash
      run: corepack enable

    - name: Install and build Node Lambda package
      if: (steps.decision.outputs.should_build == 'true' || steps.reuse.outputs.hit != 'true') && inputs.runtime == 'node'
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.pat }}
        BUILD_DIRECTORY: ${{ inputs.build_directory }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/build-node-package.sh"

    - name: Package Lambda
      id: package
      if: steps.decision.outputs.should_build == 'true' || steps.reuse.outputs.hit != 'true'
      shell: bash
      run: |
        set -Eeuo pipefail
        if [ ! -f "$GITHUB_ACTION_PATH/determine-env-and-key.sh" ]; then
          echo "Missing helper: $GITHUB_ACTION_PATH/determine-env-and-key.sh" >&2
          exit 1
        fi
        eval "$(bash "$GITHUB_ACTION_PATH/determine-env-and-key.sh" --branch "${{ github.ref_name }}" --key-prefix "${{ inputs.key_prefix }}" --sha "${{ github.sha }}")"
        S3_KEY="$s3_key"
        if [ -z "${S3_KEY:-}" ]; then
          echo "Failed to compute S3_KEY" >&2
          exit 1
        fi
        S3_URI="s3://${{ inputs.s3_bucket_name }}/$S3_KEY"

        echo "Building new Lambda package..."

        TEMP_DIR=$(mktemp -d)

        # Node bundles are pre-built by the "Install and build Node Lambda
        # package" step above; zip its dist/lambda output flat. Python keeps
        # the original copy-build_directory-then-install-deps flow below
        # byte-for-byte, so existing Python callers are unaffected.
        if [ "${{ inputs.runtime }}" = "node" ]; then
          cp -r "${{ inputs.build_directory }}/dist/lambda/." "$TEMP_DIR/"

          cd "$TEMP_DIR"
        else
          source "$GITHUB_ACTION_PATH/export-build-env.sh" --json "${{ inputs.build_env }}"

          cp -r ${{ inputs.build_directory }}/* $TEMP_DIR/

          cd $TEMP_DIR

          if [ -f "package.json" ]; then
            npm install --production
          elif [ -f "requirements.txt" ]; then
            echo "Installing Python dependencies with Python ${{ inputs.python_version }}..."
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt -t .
          fi
        fi

        zip -r lambda_package.zip ./* -x "*.git*" "*__pycache__*" "*.pytest_cache*" "*.venv*"

        aws s3 cp lambda_package.zip $S3_URI

        rm -rf $TEMP_DIR

        echo "s3_key=$S3_KEY" >> $GITHUB_OUTPUT

    - name: Update build ledger
      if: ${{ always() && steps.decision.outcome == 'success' && (steps.decision.outputs.should_build == 'true' || steps.reuse.outputs.hit != 'true') }}
      shell: bash
      env:
        ARTIFACT_ID: ${{ inputs.key_prefix }}
        S3_BUCKET: ${{ inputs.s3_bucket_name }}
        ENV: ${{ env.ENV }}
        LEDGER_PREFIX: ${{ inputs.ledger_prefix }}
        PACKAGE_OUTCOME: ${{ steps.package.outcome }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../../lib/ledger.sh"
        status="failure"
        if [[ "${PACKAGE_OUTCOME}" == "success" ]]; then
          status="success"
        fi
        ledger_write "$ARTIFACT_ID" "$status" "$GITHUB_SHA" "$S3_BUCKET" "$ENV" "${LEDGER_PREFIX:-build-ledger/}"
