name: 'Update standalone ECS task definitions'
description: 'Registers new revisions for standalone (cron/manual) ECS task definitions with updated container images.'
inputs:
  standalone-tasks-json:
    description: 'JSON object mapping task keys to { task_definition_arn, image_service_id, optional?, scheduled?, eventbridge_target?, eventbridge_rule_name?, eventbridge_bus_name? }.'
    required: true
  image-uris-json:
    description: 'JSON object of service id -> ECR image URI.'
    required: true
  rebuilt-service-ids-json:
    description: 'JSON array of service ids rebuilt in this workflow run.'
    required: true
  env-or-infra-changed:
    description: 'Whether deploy/env or infra paths changed (true/false string from matrix job).'
    required: true

runs:
  using: composite
  steps:
    - name: Update standalone task definitions
      shell: bash
      env:
        STANDALONE_TASKS_JSON: ${{ inputs.standalone-tasks-json }}
        IMAGE_URIS_JSON: ${{ inputs.image-uris-json }}
        REBUILT_SERVICE_IDS_JSON: ${{ inputs.rebuilt-service-ids-json }}
        ENV_OR_INFRA_CHANGED: ${{ inputs.env-or-infra-changed }}
      run: bash "${{ github.action_path }}/update-standalone-tasks.sh"
